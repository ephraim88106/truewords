<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말의 기록 — 정치인 발언 아카이브</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --card2:#21252e; --line:#2c313c;
    --txt:#e8eaed; --muted:#9aa0ab; --accent:#e0b84c; --accent2:#5b9dd9;
    --tag:#2a3340; --tagtxt:#9fc3e8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.6}
  header{padding:40px 20px 28px;text-align:center;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#13161c,#0f1115)}
  header h1{font-size:30px;letter-spacing:-1px;font-weight:800}
  header h1 span{color:var(--accent)}
  header p{color:var(--muted);margin-top:8px;font-size:14px}
  .wrap{max-width:860px;margin:0 auto;padding:24px 16px 80px}
  .controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
  .search{width:100%;padding:13px 16px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:15px}
  .search::placeholder{color:var(--muted)}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
  select{padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:13px}
  .count{margin-left:auto;color:var(--muted);font-size:13px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .chip{padding:5px 11px;background:var(--tag);color:var(--tagtxt);border:1px solid transparent;border-radius:20px;font-size:12px;cursor:pointer;user-select:none}
  .chip.active{background:var(--accent2);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px;transition:.15s}
  .card:hover{border-color:#3a4150}
  .quote{font-size:18px;font-weight:600;letter-spacing:-.3px;margin-bottom:14px}
  .quote::before{content:'\201C';color:var(--accent);font-size:22px;margin-right:2px}
  .quote::after{content:'\201D';color:var(--accent);font-size:22px;margin-left:2px}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:13px}
  .who{color:var(--txt);font-weight:700}
  .party{padding:2px 9px;border-radius:6px;background:var(--card2);font-size:12px;color:var(--accent2)}
  .ctx{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);color:#c4c9d2;font-size:14px}
  .cardtags{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
  .cardtag{font-size:11px;color:var(--tagtxt);background:var(--tag);padding:3px 9px;border-radius:14px;cursor:pointer}
  .src{margin-top:12px;font-size:13px}
  .src a{color:var(--accent2);text-decoration:none}
  .src a:hover{text-decoration:underline}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .note{margin-top:30px;padding:16px 18px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:13px}
  .note b{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>말의 <span>기록</span></h1>
  <p>정치인의 공개 발언을 출처와 함께 박제하는 아카이브 · 6·3 지방선거</p>
</header>

<div class="wrap">
  <div class="controls">
    <input id="search" class="search" type="text" placeholder="발언, 인물, 키워드 검색…">
    <div class="filters">
      <select id="party"><option value="">전체 정당</option></select>
      <select id="sort">
        <option value="new">최신순</option>
        <option value="old">오래된순</option>
      </select>
      <span class="count" id="count"></span>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="list"></div>

  <div class="note">
    <b>운영 원칙</b> — 이 아카이브에는 <b>실제로 확인 가능한 공개 발언만</b>, 반드시 출처(기사 링크)와 함께 등록합니다.
    현재 수록된 발언은 2026년 6·3 지방선거 광역단체장 후보(서울 오세훈·정원오, 부산 박형준, 경기 추미애, 인천 유정복·박찬대)의 발언으로, 각 항목의 출처 링크에서 원문을 확인할 수 있습니다.
    발언을 추가할 때는 파일 안의 <code>QUOTES</code> 목록에 같은 형식(발언·발언자·정당·날짜·맥락·출처·링크·태그)으로 입력하세요.
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────
//  발언 데이터  ※ 모두 출처가 확인된 실제 공개 발언입니다.
//  추가 시: text(발언) / who(발언자) / party(정당) /
//  date(YYYY-MM-DD) / context(맥락) / source(출처명) / url(링크) / tags(태그배열)
// ─────────────────────────────────────────────────────────────
const QUOTES = [
  {
    text: "이번 선거는 서울이 미래로 가느냐, 퇴보하느냐의 갈림길이다.",
    who: "오세훈", party: "국민의힘", date: "2026-05-29",
    context: "6·3 지방선거 사전투표 첫날, 용산구 한남동 주민센터에서 사전투표를 마친 뒤 취재진에게 한 발언.",
    source: "머니투데이", url: "https://www.mt.co.kr/politics/2026/05/29/2026052908580991189",
    tags: ["6·3지방선거", "서울시장", "투표"]
  },
  {
    text: "(더불어민주당이) 선거에서 이기게 되면 공소취소 특별검사법 추진 등 정권의 독주가 다시 시작될 것이다.",
    who: "오세훈", party: "국민의힘", date: "2026-05-29",
    context: "사전투표 후 정권 견제론을 강조하며. “유권자분들이 이 대통령이 겸손하게 국정을 이끌도록 만드는 방법을 생각해달라”고 덧붙였다.",
    source: "머니투데이", url: "https://www.mt.co.kr/politics/2026/05/29/2026052908580991189",
    tags: ["6·3지방선거", "정권견제", "특검"]
  },
  {
    text: "앞에 다 거짓말을 했다.",
    who: "오세훈", party: "국민의힘", date: "2026-05-28",
    context: "선관위 주관 서울시장 후보 TV토론회에서 정원오 후보와 주택 공급 공약을 두고 공방 중 한 발언.",
    source: "뉴스핌", url: "https://www.newspim.com/news/view/20260529000005",
    tags: ["6·3지방선거", "서울시장", "TV토론"]
  },
  {
    text: "전시행정이 아닌 공론화 과정을 거치고, 약속한 일들은 끝까지 책임지고 완수하겠다.",
    who: "정원오", party: "더불어민주당", date: "2026-05-26",
    context: "‘서울의 목소리’ 시민보고회에서. 시민 의견 4818건 분석 결과 집값·월세가 최다 비중을 차지했다고 밝히며 한 발언.",
    source: "서울신문", url: "https://www.seoul.co.kr/news/politics/local-election2026/2026/05/26/20260526500168",
    tags: ["6·3지방선거", "서울시장", "공약", "공론화"]
  },
  {
    text: "본인이 약속한 거의 절반도 못 했다.",
    who: "정원오", party: "더불어민주당", date: "2026-05-28",
    context: "TV토론회에서 오세훈 후보가 2021년 5년간 36만호 공급을 약속했으나 2022~2024년 3만9000호만 착공했다며 비판한 발언.",
    source: "뉴스핌", url: "https://www.newspim.com/news/view/20260529000005",
    tags: ["6·3지방선거", "부동산", "주택공급", "TV토론"]
  },
  {
    text: "반칙하지 마라. 제 시간인데 왜 끊고 반칙을 하느냐.",
    who: "정원오", party: "더불어민주당", date: "2026-05-28",
    context: "TV토론회에서 오세훈 후보가 발언 도중 끼어들자 항의하며 한 발언.",
    source: "뉴스핌", url: "https://www.newspim.com/news/view/20260529000005",
    tags: ["6·3지방선거", "서울시장", "TV토론"]
  },
  {
    text: "행정 성과는 5년에서 10년 뒤 나타나는 만큼 진행 중인 정책을 마무리하는 것이 책임 있는 선택이다.",
    who: "박형준", party: "국민의힘", date: "2026-05-12",
    context: "부산시장 3선 도전 배경을 묻는 뉴스핌 인터뷰에서 시정의 연속성을 강조하며 한 발언.",
    source: "뉴스핌", url: "https://www.newspim.com/news/view/20260512000470",
    tags: ["6·3지방선거", "부산시장", "3선", "시정연속성"]
  },
  {
    text: "대통령은 왕이 아니다. 민주공화국에서 대통령은 국민이 권한을 위임한 공복이지, 자기 사건을 법으로 지울 수 있는 사람이 아니다.",
    who: "박형준", party: "국민의힘", date: "2026-05-12",
    context: "뉴스핌 인터뷰에서 여당의 이른바 ‘공소취소 특검법’에 대한 입장을 밝히며 한 발언.",
    source: "뉴스핌", url: "https://www.newspim.com/news/view/20260512000470",
    tags: ["6·3지방선거", "부산시장", "특검", "법치"]
  },
  {
    text: "6월 3일 이재명 정부의 국정 철학과 기조가 지방자치까지 스며들 수 있도록 보조를 맞출 수 있는 유능한 일꾼을 뽑아달라.",
    who: "추미애", party: "더불어민주당", date: "2026-05-29",
    context: "경기도지사 후보로서 사전투표 첫날 수원 인계동 행정복지센터에서 사전투표를 마친 뒤 한 발언.",
    source: "파이낸셜뉴스", url: "https://www.fnnews.com/news/202605291102502158",
    tags: ["6·3지방선거", "경기도지사", "투표", "국정"]
  },
  {
    text: "31개 시·군 단체장, 도의원, 모두 당선시켜 주시면 효능감 100%로 돌려드리겠다.",
    who: "추미애", party: "더불어민주당", date: "2026-05-29",
    context: "사전투표 후 지지를 호소하며. 경기도민이 어디 살든 자부심을 가질 도정을 만들겠다고 강조했다.",
    source: "파이낸셜뉴스", url: "https://www.fnnews.com/news/202605291102502158",
    tags: ["6·3지방선거", "경기도지사", "투표"]
  },
  {
    text: "이번 선거는 단순한 정치 경쟁이 아니라 인천의 미래를 결정하는 중요한 선택이다.",
    who: "유정복", party: "국민의힘", date: "2026-05-27",
    context: "인천시장 3선에 도전하며 뉴스핌 인터뷰에서. “검증된 경험과 책임 있는 리더십으로 세계 초일류 인천국제자유특별시를 완성하겠다”고 밝혔다.",
    source: "뉴스핌", url: "https://www.newspim.com/news/view/20260526001232",
    tags: ["6·3지방선거", "인천시장", "3선"]
  },
  {
    text: "우리 적은 북한 정권과 북한군이라는 답변을 기대하시는 것 아니냐. 국민의힘의 주적론은 한심하다.",
    who: "박찬대", party: "더불어민주당", date: "2026-05-26",
    context: "인천MBC 인천시장 후보 TV토론회에서 유정복 후보가 “주적이 누구냐”고 묻자 ‘색깔론’이라며 반박한 발언.",
    source: "아주경제", url: "https://www.ajunews.com/view/20260526233955913",
    tags: ["6·3지방선거", "인천시장", "TV토론", "색깔론"]
  }
];

// ───────── 렌더링 로직 ─────────
const $ = id => document.getElementById(id);
let activeTags = new Set();

function allTags(){ const s=new Set(); QUOTES.forEach(q=>q.tags.forEach(t=>s.add(t))); return [...s].sort(); }
function allParties(){ const s=new Set(); QUOTES.forEach(q=>s.add(q.party)); return [...s].sort(); }

function init(){
  allParties().forEach(p=>{ const o=document.createElement('option'); o.value=p; o.textContent=p; $('party').appendChild(o); });
  const chips=$('chips');
  allTags().forEach(t=>{
    const c=document.createElement('span'); c.className='chip'; c.textContent='#'+t;
    c.onclick=()=>{ if(activeTags.has(t)){activeTags.delete(t);c.classList.remove('active');} else {activeTags.add(t);c.classList.add('active');} render(); };
    chips.appendChild(c);
  });
  ['search','party','sort'].forEach(id=>$(id).addEventListener('input',render));
  render();
}

function render(){
  const q=$('search').value.trim().toLowerCase();
  const party=$('party').value;
  const sort=$('sort').value;
  let items=QUOTES.filter(it=>{
    if(party && it.party!==party) return false;
    if(activeTags.size && ![...activeTags].every(t=>it.tags.includes(t))) return false;
    if(q){
      const hay=(it.text+' '+it.who+' '+it.party+' '+it.context+' '+it.tags.join(' ')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  items.sort((a,b)=> sort==='new' ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date));
  $('count').textContent = items.length + '건';

  const list=$('list');
  if(!items.length){ list.innerHTML='<div class="empty">조건에 맞는 발언이 없습니다.</div>'; return; }
  list.innerHTML = items.map(it=>`
    <div class="card">
      <div class="quote">${esc(it.text)}</div>
      <div class="meta">
        <span class="who">${esc(it.who)}</span>
        <span class="party">${esc(it.party)}</span>
        <span>${esc(it.date)}</span>
      </div>
      <div class="ctx">${esc(it.context)}</div>
      <div class="cardtags">${it.tags.map(t=>`<span class="cardtag">#${esc(t)}</span>`).join('')}</div>
      <div class="src">출처: ${it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.source)} ↗</a>` : esc(it.source)}</div>
    </div>`).join('');
}

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
init();
</script>
</body>
</html>
