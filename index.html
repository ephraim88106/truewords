<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말의 기록 — 정치인 발언 아카이브</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --card2:#21252e; --line:#2c313c;
    --txt:#e8eaed; --muted:#9aa0ab; --accent:#e0b84c; --accent2:#5b9dd9;
    --tag:#2a3340; --tagtxt:#9fc3e8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.6}
  header{padding:40px 20px 28px;text-align:center;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#13161c,#0f1115)}
  header h1{font-size:30px;letter-spacing:-1px;font-weight:800}
  header h1 span{color:var(--accent)}
  header p{color:var(--muted);margin-top:8px;font-size:14px}
  .wrap{max-width:860px;margin:0 auto;padding:24px 16px 80px}
  .controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
  .search{width:100%;padding:13px 16px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:15px}
  .search::placeholder{color:var(--muted)}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
  select{padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:13px}
  .count{margin-left:auto;color:var(--muted);font-size:13px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .chip{padding:5px 11px;background:var(--tag);color:var(--tagtxt);border:1px solid transparent;border-radius:20px;font-size:12px;cursor:pointer;user-select:none}
  .chip.active{background:var(--accent2);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px;transition:.15s}
  .card:hover{border-color:#3a4150}
  .quote{font-size:18px;font-weight:600;letter-spacing:-.3px;margin-bottom:14px}
  .quote::before{content:'\201C';color:var(--accent);font-size:22px;margin-right:2px}
  .quote::after{content:'\201D';color:var(--accent);font-size:22px;margin-left:2px}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:13px}
  .who{color:var(--txt);font-weight:700}
  .party{padding:2px 9px;border-radius:6px;background:var(--card2);font-size:12px;color:var(--accent2)}
  .ctx{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);color:#c4c9d2;font-size:14px}
  .cardtags{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
  .cardtag{font-size:11px;color:var(--tagtxt);background:var(--tag);padding:3px 9px;border-radius:14px;cursor:pointer}
  .src{margin-top:12px;font-size:13px}
  .src a{color:var(--accent2);text-decoration:none}
  .src a:hover{text-decoration:underline}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .note{margin-top:30px;padding:16px 18px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:13px}
  .note b{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>말의 <span>기록</span></h1>
  <p>정치인의 공개 발언을 출처와 함께 박제하는 아카이브 · 6·3 지방선거</p>
</header>

<div class="wrap">
  <div class="controls">
    <input id="search" class="search" type="text" placeholder="발언, 인물, 키워드 검색…">
    <div class="filters">
      <select id="party"><option value="">전체 정당</option></select>
      <select id="sort">
        <option value="new">최신순</option>
        <option value="old">오래된순</option>
      </select>
      <span class="count" id="count"></span>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="list"></div>

  <div class="note">
    <b>운영 원칙</b> — 이 아카이브에는 <b>실제로 확인 가능한 공개 발언만</b>, 반드시 출처(기사 링크)와 함께 등록합니다.
    현재 수록된 발언은 2026년 6·3 지방선거 서울시장 후보 오세훈·정원오의 발언으로, 각 항목의 출처 링크에서 원문을 확인할 수 있습니다.
    발언을 추가할 때는 파일 안의 <code>QUOTES</code> 목록에 같은 형식(발언·발언자·정당·날짜·맥락·출처·링크·태그)으로 입력하세요.
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────
//  발언 데이터  ※ 아래는 구조 시연용 예시(가상 인물)입니다.

const QUOTES = [

    source: "머니투데이", url: "https://www.mt.co.kr/politics/2026/05/29/2026052908580991189",

    text: "(더불어민주당이) 선거에서 이기게 되면 공소취소 특별검사법 추진 등 정권의 독주가 다시 시작될 것이다.",
    who: "오세훈", party: "국민의힘", date: "2026-05-29",

// ───────── 렌더링 로직 ─────────
const $ = id => document.getElementById(id);
let activeTags = new Set();

function allTags(){ const s=new Set(); QUOTES.forEach(q=>q.tags.forEach(t=>s.add(t))); return [...s].sort(); }
function allParties(){ const s=new Set(); QUOTES.forEach(q=>s.add(q.party)); return [...s].sort(); }

function init(){
  allParties().forEach(p=>{ const o=document.createElement('option'); o.value=p; o.textContent=p; $('party').appendChild(o); });
  const chips=$('chips');
  allTags().forEach(t=>{
    const c=document.createElement('span'); c.className='chip'; c.textContent='#'+t;
    c.onclick=()=>{ if(activeTags.has(t))
